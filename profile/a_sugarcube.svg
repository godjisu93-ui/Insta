<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <!-- 콘셉트 A: 다이어트 중인 각설탕 '당당이' -->
  <defs>
    <clipPath id="cube"><rect x="320" y="290" width="460" height="460" rx="84"/></clipPath>
  </defs>
  <rect width="1080" height="1080" fill="#0E5E57"/>
  <circle cx="540" cy="560" r="400" fill="#0A4742" opacity=".55"/>

  <!-- 달리는 효과선 -->
  <g stroke="#FFD166" stroke-width="20" stroke-linecap="round">
    <line x1="160" y1="450" x2="250" y2="450"/>
    <line x1="120" y1="545" x2="250" y2="545"/>
    <line x1="170" y1="640" x2="250" y2="640"/>
  </g>

  <!-- 그림자 -->
  <ellipse cx="560" cy="905" rx="230" ry="26" fill="#000" opacity=".2"/>

  <!-- 다리 + 운동화 -->
  <g stroke="#FFFFFF" stroke-width="30" stroke-linecap="round" fill="none">
    <path d="M470 740 L430 840"/>
    <path d="M640 740 L700 825"/>
  </g>
  <rect x="380" y="832" width="112" height="54" rx="27" fill="#F2772E"/>
  <rect x="380" y="866" width="112" height="20" rx="10" fill="#FFFFFF" opacity=".9"/>
  <g transform="rotate(-18 720 845)">
    <rect x="664" y="818" width="112" height="54" rx="27" fill="#F2772E"/>
    <rect x="664" y="852" width="112" height="20" rx="10" fill="#FFFFFF" opacity=".9"/>
  </g>

  <!-- 팔 (주먹 불끈) -->
  <g stroke="#FFFFFF" stroke-width="30" stroke-linecap="round" fill="none">
    <path d="M325 560 Q260 560 250 480"/>
    <path d="M775 560 Q850 580 870 650"/>
  </g>
  <circle cx="250" cy="470" r="30" fill="#FFFFFF"/>
  <circle cx="872" cy="660" r="30" fill="#FFFFFF"/>

  <!-- 각설탕 몸 -->
  <rect x="320" y="290" width="460" height="460" rx="84" fill="#FFFFFF"/>
  <g clip-path="url(#cube)">
    <rect x="320" y="670" width="460" height="90" fill="#EEE8DD"/>
    <!-- 머리띠 -->
    <rect x="300" y="360" width="500" height="66" fill="#F2772E"/>
    <rect x="300" y="414" width="500" height="12" fill="#D9601C"/>
  </g>
  <!-- 머리띠 꼬리 -->
  <rect x="760" y="352" width="120" height="38" rx="19" fill="#F2772E" transform="rotate(-24 770 371)"/>
  <rect x="760" y="392" width="104" height="38" rx="19" fill="#D9601C" transform="rotate(14 770 411)"/>

  <!-- 설탕 결정 반짝이 -->
  <g fill="#E6DFD2">
    <rect x="372" y="630" width="24" height="24" rx="6" transform="rotate(20 384 642)"/>
    <rect x="712" y="470" width="20" height="20" rx="5" transform="rotate(-15 722 480)"/>
    <rect x="690" y="660" width="26" height="26" rx="6" transform="rotate(30 703 673)"/>
    <rect x="380" y="470" width="18" height="18" rx="5"/>
  </g>

  <!-- 얼굴 -->
  <ellipse cx="470" cy="540" rx="30" ry="38" fill="#1E2928"/>
  <ellipse cx="630" cy="540" rx="30" ry="38" fill="#1E2928"/>
  <circle cx="460" cy="525" r="11" fill="#FFFFFF"/>
  <circle cx="620" cy="525" r="11" fill="#FFFFFF"/>
  <ellipse cx="418" cy="608" rx="38" ry="22" fill="#FF9C9C" opacity=".75"/>
  <ellipse cx="682" cy="608" rx="38" ry="22" fill="#FF9C9C" opacity=".75"/>
  <path d="M508 596 Q550 650 592 596 Z" fill="#1E2928" stroke="#1E2928" stroke-width="10" stroke-linejoin="round"/>
  <path d="M528 626 Q550 642 572 626 Q560 612 550 616 Q540 612 528 626 Z" fill="#FF7B7B"/>

  <!-- 땀방울 -->
  <path d="M300 280 C 282 316 276 338 300 352 C 324 338 318 316 300 280 Z" fill="#9ED8FF"/>
</svg>
